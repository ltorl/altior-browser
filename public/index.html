    <style>
        :root {
            --bg: #282828;
            --fg: #3c3c3c;
            --text: #e8e8e8;
            --muted: #9aa0a6;
            --trash-icon: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            user-select: none;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        #tabbar {
            display: flex;
            align-items: flex-end;
            height: 40px;
            background: var(--bg);
            padding: 0 6px 0 40px;
            gap: 0;
            flex: 0 0 auto;
            overflow: hidden;
            max-height: 40px;
            transition: max-height 0.25s ease;
        }

        #app.chrome-hidden #tabbar {
            max-height: 0;
        }


        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.15s ease, transform 0.25s ease;
            flex: 0 0 auto;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .icon-btn img {
            pointer-events: none;
            -webkit-user-drag: none;
        }

        #collapse-btn {
            position: absolute;
            top: 5px;
            left: 6px;
            width: 30px;
            height: 30px;
            z-index: 100;
            transform: translateY(3px);
        }

        #collapse-btn img {
            width: 18px;
            height: 18px;
            transition: transform 0.25s ease;
            filter: invert(1);
        }

        #collapse-btn.collapsed img {
            transform: rotate(180deg);
        }

        #app.chrome-hidden #collapse-btn {
            background: rgba(40, 40, 40, 0.85);
        }

        #app.chrome-hidden #collapse-btn:hover {
            background: rgba(60, 60, 60, 0.95);
        }

        #tabs {
            display: flex;
            align-items: flex-end;
            flex: 0 1 auto;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            padding: 0 8px;
            isolation: isolate;
        }

        #tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 100px;
            width: 232px;
            height: 32px;
            padding: 0 10px;
            background: var(--bg);
            color: var(--muted);
            cursor: default;
            position: relative;
            border-radius: 10px 10px 0 0;
            flex: 0 1 232px;
            font-size: 13px;
            transition: background 0.12s ease;
        }

        .tab:not(.active):hover {
            isolation: isolate;
        }

        .tab .favicon,
        .tab .tab-title,
        .tab .tab-close {
            transition: transform 0.2s ease;
        }

        .tab:not(.active) .favicon,
        .tab:not(.active) .tab-title,
        .tab:not(.active) .tab-close {
            transform: translateY(-3px);
        }

        .tab:not(.active):hover::before {
            content: '';
            position: absolute;
            left: 2px;
            right: 2px;
            top: 0;
            bottom: 6px;
            background: #474747;
            border-radius: 8px;
            pointer-events: none;
            z-index: -1;
        }

        .tab.dragging {
            z-index: 5;
            cursor: grabbing;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
            transition: none;
        }

        .tab.pinned {
            width: 36px;
            min-width: 36px;
            flex: 0 0 36px;
        }

        .tab.label-anim .tab-title {
            text-overflow: clip;
        }

        .tab.active {
            background: var(--fg);
            color: var(--text);
            z-index: 1;
        }

        .tab.active::before,
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 8px;
            height: 8px;
            pointer-events: none;
        }

        .tab.active::before {
            left: -8px;
            background: radial-gradient(circle at top left, transparent 8px, var(--fg) 8px);
        }

        .tab.active::after {
            right: -8px;
            background: radial-gradient(circle at top right, transparent 8px, var(--fg) 8px);
        }

        .tab .favicon {
            width: 16px;
            height: 16px;
            flex: 0 0 16px;
            border-radius: 3px;
            object-fit: contain;
            -webkit-user-drag: none;
        }

        .tab.closing .favicon {
            flex: 0 1 16px;
            min-width: 0;
        }

        .tab .tab-title {
            flex: 1 1 auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab .tab-close {
            flex: 0 0 18px;
            width: 18px;
            height: 18px;
            line-height: 16px;
            text-align: center;
            border-radius: 50%;
            font-size: 16px;
            color: var(--muted);
            opacity: 1;
            transition: background 0.12s ease, transform 0.2s ease;
        }

        .tab .tab-close:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .tab-sep {
            width: 1px;
            height: 18px;
            background: var(--fg);
            flex: 0 0 1px;
            align-self: center;
            margin: 0 2px;
        }

        .tab-sep.hidden {
            background: transparent;
        }

        #newtab-btn {
            width: 28px;
            height: 28px;
            margin: 0 4px 4px -4px;
            font-size: 20px;
            color: var(--text);
            line-height: 1;
        }

        #toolbar {
            background: var(--fg);
            flex: 0 0 auto;
            overflow: hidden;
            transition: height 0.25s ease;
        }

        #navbar {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 48px;
            padding: 0 10px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
        }

        .nav-btn img {
            width: 22px;
            height: 22px;
            filter: invert(0);
            -webkit-user-drag: none;
        }

        .nav-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        #btn-back img {
            transform: rotate(180deg);
        }

        #urlbar {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            height: 32px;
            background: var(--bg);
            border-radius: 16px;
            padding: 0 6px;
            margin: 0 6px;
            border: 1px solid transparent;
            transition: border-color 0.15s ease;
        }

        #urlbar:focus-within {
            border-color: rgba(120, 170, 255, 0.6);
        }

        #url-input {
            flex: 1 1 auto;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 14px;
            user-select: text;
        }

        #url-input::placeholder {
            color: var(--muted);
        }

        #url-suggest {
            position: fixed;
            z-index: 50;
            background: var(--bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
        }

        #url-suggest.open {
            display: block;
        }

        #url-suggest .suggest-item {
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #url-suggest .suggest-item.active {
            background: rgba(255, 255, 255, 0.10);
        }

        #url-suggest .suggest-item.open-link {
            color: #cfe0ff;
            background: rgba(80, 130, 255, 0.18);
        }

        #url-suggest .suggest-item.open-link.active {
            background: rgba(80, 130, 255, 0.32);
        }

        #site-btn {
            flex: 0 0 auto;
            width: 24px;
            height: 24px;
            padding: 0;
            margin-left: -3px;
            margin-right: 6px;
            border-radius: 50%;
            background: #3c3c3c;
        }

        #site-btn:hover,
        #site-btn.active {
            background: #555554;
        }

        #site-btn img {
            width: 20px;
            height: 20px;
            -webkit-user-drag: none;
        }

        #site-panel {
            position: fixed;
            z-index: 50;
            min-width: 250px;
            background: var(--fg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: var(--text);
            display: none;
        }

        #site-panel.open {
            display: block;
        }

        #site-panel .site-panel-head {
            font-size: 13px;
            font-weight: 600;
            word-break: break-all;
            margin-bottom: 10px;
        }

        #site-panel .site-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
            padding: 4px 0;
        }

        #site-panel .site-status {
            color: var(--muted);
        }

        #site-panel .site-reset {
            margin-top: 12px;
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.10);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
        }

        #site-panel .site-reset:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
        }

        #site-panel .site-reset:disabled {
            opacity: 0.45;
            cursor: default;
        }

        #star-btn {
            width: 24px;
            height: 24px;
            flex: 0 0 24px;
        }

        #star-btn img {
            width: 18px;
            height: 18px;
            -webkit-user-drag: none;
        }

        #games-btn,
        #settings-btn {
            margin-left: 2px;
        }

        #games-btn img,
        #settings-btn img {
            width: 22px;
            height: 22px;
            filter: none;
            -webkit-user-drag: none;
        }

        #games-btn.active,
        #settings-btn.active {
            background: rgba(120, 170, 255, 0.18);
        }

        .sidebar {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 300px;
            max-width: 80%;
            background: var(--fg);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: -18px 0 16px -16px rgba(0, 0, 0, 0.45);
            z-index: 20;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.22s ease;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 10px 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex: 0 0 auto;
        }

        .sidebar-close {
            width: 30px;
            height: 30px;
            font-size: 20px;
            color: var(--text);
            line-height: 1;
        }

        .sidebar-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            overflow-y: auto;
        }

        #games-sidebar-list .gs-link {
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        #games-sidebar-list .gs-link:hover {
            background: #45a29e;
            color: #0b0c10;
            transform: translateX(-2px);
        }

        .settingspage {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            background: linear-gradient(135deg, #0b0c10 0%, #1f2833 100%);
            color: var(--text);
            padding: 40px 20px 60px;
        }

        .settingspage .set-inner {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .settingspage .set-title {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .set-group {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--muted);
            margin: 18px 4px 2px;
        }

        .set-option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .set-option:hover {
            background: rgba(255, 255, 255, 0.11);
        }

        .set-option.selected {
            border-color: #45a29e;
            background: rgba(69, 162, 158, 0.16);
        }

        .set-radio {
            flex: 0 0 14px;
            width: 14px;
            height: 14px;
            margin-top: 3px;
            border-radius: 50%;
            border: 2px solid var(--muted);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .set-option.selected .set-radio {
            border-color: #66fcf1;
            box-shadow: inset 0 0 0 3px #66fcf1;
        }

        .set-option .set-name {
            font-size: 0.92rem;
            font-weight: 600;
        }

        .set-option .set-desc {
            font-size: 0.76rem;
            line-height: 1.45;
            color: var(--muted);
            margin-top: 3px;
        }

        .set-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 6px;
            font-size: 0.76rem;
            color: var(--muted);
        }

        .set-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
            flex: 0 0 8px;
        }

        .set-dot.ready {
            background: #66fcf1;
        }

        .set-dot.failed {
            background: #e06c6c;
        }

        .set-note {
            padding: 0 6px;
            font-size: 0.72rem;
            line-height: 1.5;
            color: var(--muted);
        }

        .set-site {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 10px 10px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            font-size: 0.88rem;
        }

        .set-site .set-site-name {
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .set-site .set-del {
            flex: 0 0 auto;
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        /* Masked so the glyph takes its colour from the button state. */
        .set-site .set-del::before {
            content: '';
            width: 17px;
            height: 17px;
            background: var(--muted);
            transition: background 0.15s ease;
            -webkit-mask: var(--trash-icon) center / contain no-repeat;
            mask: var(--trash-icon) center / contain no-repeat;
        }

        .set-site .set-del:hover {
            background: rgba(224, 108, 108, 0.18);
        }

        .set-site .set-del:hover::before {
            background: #ffb4b4;
        }

        .set-empty {
            padding: 14px;
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.14);
            font-size: 0.82rem;
            color: var(--muted);
            text-align: center;
        }

        #bookmarksbar {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 34px;
            padding: 0 8px;
            background: var(--fg);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            white-space: nowrap;
        }

        #bookmarksbar::-webkit-scrollbar {
            display: none;
        }

        .bm {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 26px;
            padding: 0 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text);
            max-width: 180px;
            flex: 0 0 auto;
            transition: background 0.12s ease;
        }

        .bm:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .bm img {
            width: 16px;
            height: 16px;
            flex: 0 0 16px;
            object-fit: contain;
            -webkit-user-drag: none;
        }

        .bm .bm-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #bookmarksbar.empty {
            display: none;
        }

        #content {
            flex: 1 1 auto;
            position: relative;
            background: var(--bg);
        }

        .panel {
            position: absolute;
            inset: 0;
            display: none;
        }

        .panel.active {
            display: block;
        }

        .panel iframe.webframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #fff;
        }

        .newtab {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            background: linear-gradient(135deg, #0b0c10 0%, #1f2833 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .newtab .nt-title {
            font-size: 3.4rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 195, 255, 0.6);
            margin-bottom: 28px;
        }

        .newtab .nt-search {
            position: relative;
            width: 90%;
            max-width: 600px;
        }

        .newtab .nt-input-group {
            display: flex;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .newtab .nt-suggest {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(20, 26, 33, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 6px;
            z-index: 5;
            display: none;
        }

        .newtab .nt-suggest.open {
            display: block;
        }

        .newtab .nt-suggest .suggest-item {
            padding: 12px 18px;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .newtab .nt-suggest .suggest-item.active {
            background: #45a29e;
            color: #0b0c10;
        }

        .newtab .nt-input-group:focus-within {
            border-color: rgba(0, 195, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 195, 255, 0.15);
        }

        .newtab .nt-input {
            flex: 1 1 auto;
            padding: 14px 20px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 16px;
            outline: none;
            user-select: text;
        }

        .newtab .nt-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .newtab .nt-go {
            padding: 12px 28px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background: #45a29e;
            color: #0b0c10;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .newtab .nt-go:hover {
            background: #66fcf1;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.5);
        }

        #ctx-menu {
            position: fixed;
            min-width: 200px;
            background: #2b2b2b;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 6px 0;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
            z-index: 10000;
            display: none;
            font-size: 13px;
        }

        #ctx-menu .ctx-item {
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text);
            white-space: nowrap;
        }

        #ctx-menu .ctx-item:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        #ctx-menu .ctx-item.disabled {
            color: var(--muted);
            pointer-events: none;
        }

        #ctx-menu .ctx-sep {
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
            margin: 6px 0;
        }

        .bm-dropdown {
            position: fixed;
            min-width: 200px;
            background: #2b2b2b;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 6px 0;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
            z-index: 9000;
            font-size: 13px;
        }

        .bm-dropdown .dd-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            cursor: pointer;
            color: var(--text);
            max-width: 280px;
        }

        .bm-dropdown .dd-item:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .bm-dropdown .dd-item img {
            width: 16px;
            height: 16px;
            flex: 0 0 16px;
            object-fit: contain;
        }

        .bm-dropdown .dd-item .dd-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bm-dropdown .dd-empty {
            padding: 7px 14px;
            color: var(--muted);
        }

        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 11000;
        }

        #modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #2b2b2b;
            border-radius: 12px;
            padding: 22px;
            width: 380px;
            max-width: 90vw;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .modal h3 {
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 600;
        }

        .modal label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin: 10px 0 4px;
        }

        .modal input {
            width: 100%;
            padding: 9px 12px;
            background: var(--bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            user-select: text;
        }

        .modal input:focus {
            border-color: rgba(120, 170, 255, 0.6);
        }

        .modal .modal-msg {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text);
            word-break: break-all;
            white-space: pre-line;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            padding: 8px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .btn-ok {
            background: #4a90d9;
            color: #fff;
        }

        .btn-ok:hover {
            background: #5a9fe8;
        }
    </style>
</head>

<body>
    <div id="app">
        <button id="collapse-btn" class="icon-btn" title="Hide toolbar"></button>

        <div id="tabbar">
            <div id="tabs"></div>
            <button id="newtab-btn" class="icon-btn" title="新しいタブ">+</button>
        </div>

        <div id="toolbar">
            <div id="navbar">
                <button id="btn-back" class="icon-btn nav-btn" title="Back"></button>
                <button id="btn-forward" class="icon-btn nav-btn" title="Forward"></button>
                <button id="btn-reload" class="icon-btn nav-btn" title="Reload"></button>
                <div id="urlbar">
                    <button id="site-btn" class="icon-btn" title="Site settings"></button>
                    <input id="url-input" type="text" spellcheck="false" autocomplete="off"
                        placeholder="DuckDuckGoで検索するかURLを入力...">
                    <button id="star-btn" class="icon-btn" title="Bookmark this page"></button>
                </div>
                <button id="games-btn" class="icon-btn nav-btn" title="Games"></button>
                <button id="settings-btn" class="icon-btn nav-btn" title="Settings"></button>
            </div>
            <div id="bookmarksbar"></div>
        </div>

        <div id="content">
            <aside id="games-sidebar" class="sidebar">
                <div class="sidebar-head">
                    <span>ゲームサイト集</span>
                    <button id="games-sidebar-close" class="icon-btn sidebar-close" title="Close">×</button>
                </div>
                <div id="games-sidebar-list" class="sidebar-body"></div>
            </aside>
        </div>

        <div id="url-suggest"></div>
        <div id="site-panel"></div>
    </div>

    <div id="ctx-menu"></div>

    <div id="modal-overlay">
        <div class="modal" id="modal-box"></div>
    </div>

function probeStores(name) {
